name: digital-kotor-me-testing

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: digital_kotor_testing
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_ROOT_PASSWORD: testing
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - digital_kotor_testing_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptesting"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - testing

  php:
    build:
      context: ./docker/testing
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # APP_KEY dolazi samo iz gitignorisanog .env.testing.
    # Šablon .env.testing.docker.example ima prazan APP_KEY i ne smije se učitati ovdje,
    # jer bi prazna vrijednost spriječila Laravel da pročita lokalni ključ.
    env_file:
      - path: .env.testing
        required: true
    environment:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: digital_kotor_testing
      DB_USERNAME: testing
      DB_PASSWORD: testing
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - testing

networks:
  testing:
    name: digital-kotor-me-testing

volumes:
  digital_kotor_testing_data:
    name: digital_kotor_testing_data
